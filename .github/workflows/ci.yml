name: Sona 0.15.4 certification

on:
  push:
    branches: [main, release/0.15.4]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Certify Python and exact release gate externally
        run: >-
          python tools/release/certify_0153.py
          --cert-root "${{ runner.temp }}/sona-cert-python-${{ matrix.python-version }}"
          --phases python,gates

      - name: Preserve platform certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.os }}-${{ matrix.python-version }}-evidence
          path: |
            ${{ runner.temp }}/sona-cert-python-${{ matrix.python-version }}/reports/
            ${{ runner.temp }}/sona-cert-python-${{ matrix.python-version }}/evidence/
          if-no-files-found: error

  native:
    name: Native Core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux static-proof prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools file

      - name: Enable the Visual Studio PE inspection tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Certify locked Native Core, bounded conformance, and Python-free proof
        run: >-
          python tools/release/certify_0153.py
          --cert-root "${{ runner.temp }}/sona-cert-native"
          --phases native,gates

      - name: Preserve native certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-evidence
          path: |
            ${{ runner.temp }}/sona-cert-native/reports/
            ${{ runner.temp }}/sona-cert-native/evidence/
            ${{ runner.temp }}/sona-cert-native/artifacts/
          if-no-files-found: error

  extension-security:
    name: Extension compile, production audit, and VSIX inspection
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Compile from external staging and inspect the VSIX
        run: >-
          python tools/release/certify_0153.py
          --cert-root "${{ runner.temp }}/sona-cert-extension"
          --phases extension

      - name: Preserve extension security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-security-evidence
          path: |
            ${{ runner.temp }}/sona-cert-extension/reports/
            ${{ runner.temp }}/sona-cert-extension/evidence/
            ${{ runner.temp }}/sona-cert-extension/artifacts/
          if-no-files-found: error

  packaging:
    name: Python build, metadata, clean install, and archive inspection
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and inspect Python distributions externally
        run: >-
          python tools/release/certify_0153.py
          --cert-root "${{ runner.temp }}/sona-cert-packaging"
          --phases packaging

      - name: Preserve package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-evidence
          path: |
            ${{ runner.temp }}/sona-cert-packaging/reports/
            ${{ runner.temp }}/sona-cert-packaging/evidence/
            ${{ runner.temp }}/sona-cert-packaging/artifacts/
          if-no-files-found: error
